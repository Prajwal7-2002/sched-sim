<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f17" />
      <stop offset="50%" stop-color="#0e0a12" />
      <stop offset="100%" stop-color="#070408" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(249, 115, 22, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Top Accent Border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#borderGrad)" stroke-width="4" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Ambient Light Blobs -->
  <circle cx="160" cy="180" r="140" fill="#f97316" opacity="0.08" filter="url(#glow)" />
  <circle cx="1040" cy="120" r="180" fill="#ef4444" opacity="0.05" filter="url(#glow)" />

  <!-- LEFT: Graphic Icon Radix Trie & DES Timeline (180x180) -->
  <g transform="translate(70, 90)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#0c0d1e" stroke="url(#orangeGrad)" stroke-width="2" />
    <rect x="12" y="12" width="156" height="156" rx="26" fill="#141124" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1" />

    <!-- Radix Trie lines -->
    <line x1="90" y1="40" x2="50" y2="100" stroke="url(#coralGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="40" x2="130" y2="100" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="100" x2="34" y2="145" stroke="url(#coralGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="100" x2="74" y2="145" stroke="url(#coralGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="130" y1="100" x2="110" y2="145" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="130" y1="100" x2="150" y2="145" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Root node -->
    <circle cx="90" cy="40" r="12" fill="#fb923c" filter="url(#glow)" />
    <circle cx="90" cy="40" r="5" fill="#ffffff" />

    <!-- Internal nodes -->
    <circle cx="50" cy="100" r="9" fill="#f87171" filter="url(#glow)" />
    <circle cx="130" cy="100" r="9" fill="#fb923c" filter="url(#glow)" />

    <!-- Leaf tokens -->
    <circle cx="34" cy="145" r="5.5" fill="#ef4444" />
    <circle cx="74" cy="145" r="5.5" fill="#ef4444" />
    <circle cx="110" cy="145" r="5.5" fill="#f97316" />
    <circle cx="150" cy="145" r="5.5" fill="#f97316" />
  </g>

  <!-- RIGHT: Branding Text & Typography -->
  <g transform="translate(300, 68)">
    <!-- Monospace Pill Badge -->
    <g>
      <rect x="0" y="0" width="375" height="28" rx="14" fill="rgba(249, 115, 22, 0.08)" stroke="rgba(249, 115, 22, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#fb923c" filter="url(#glow)" />
      <text x="28" y="18" fill="#fb923c" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">DISCRETE-EVENT SERVING SIMULATOR</text>
    </g>

    <!-- Title -->
    <text x="0" y="94" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      sched-sim <tspan fill="#f97316" font-size="52">⏱️</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2">
      High-Fidelity Discrete-Event LLM Serving Simulator &amp; Radix Prefix Cache Engine
    </text>

    <!-- Feature Tags Strip -->
    <g transform="translate(2, 172)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="186" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🌲 Radix Prefix Caching</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(196, 0)">
        <rect width="168" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🎯 Zero-Copy Hits</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(374, 0)">
        <rect width="182" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">📊 Perfetto Trace Export</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(566, 0)">
        <rect width="166" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">⏱️ Discrete-Event DES</text>
      </g>

      <!-- Tag 5 -->
      <g transform="translate(742, 0)">
        <rect width="144" height="34" rx="8" fill="rgba(249, 115, 22, 0.08)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
        <text x="14" y="21" fill="#fb923c" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">⚡ 0.87s Full Sweep</text>
      </g>
    </g>
  </g>
</svg>
