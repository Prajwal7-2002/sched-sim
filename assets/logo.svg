<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Discrete Timeline Spans (Perfetto / DES simulation tracks) -->
  <g opacity="0.25">
    <rect x="80" y="110" width="160" height="24" rx="6" fill="#f97316" />
    <rect x="260" y="110" width="172" height="24" rx="6" fill="#ef4444" />
    <rect x="80" y="378" width="210" height="24" rx="6" fill="#ef4444" />
    <rect x="310" y="378" width="122" height="24" rx="6" fill="#f97316" />
  </g>

  <!-- Central Radix Trie Tree & Chronometer Queue Node -->
  <g transform="translate(146, 146)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="220" height="220" rx="44" fill="#0c0d1e" stroke="url(#orangeGrad)" stroke-width="3" />
    <rect x="14" y="14" width="192" height="192" rx="34" fill="#141124" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1" />

    <!-- Radix Trie Branch Lines -->
    <line x1="110" y1="46" x2="60" y2="120" stroke="url(#coralGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="46" x2="160" y2="120" stroke="url(#orangeGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="120" x2="40" y2="174" stroke="url(#coralGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="120" x2="90" y2="174" stroke="url(#coralGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="120" x2="135" y2="174" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="120" x2="185" y2="174" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Root Node (Prompt Prefix Cache Root) -->
    <circle cx="110" cy="46" r="14" fill="#fb923c" filter="url(#glow)" />
    <circle cx="110" cy="46" r="6" fill="#ffffff" />

    <!-- Level 1 Nodes -->
    <circle cx="60" cy="120" r="11" fill="#f87171" filter="url(#glow)" />
    <circle cx="160" cy="120" r="11" fill="#fb923c" filter="url(#glow)" />

    <!-- Leaf Token Nodes -->
    <circle cx="40" cy="174" r="7" fill="#ef4444" />
    <circle cx="90" cy="174" r="7" fill="#ef4444" />
    <circle cx="135" cy="174" r="7" fill="#f97316" />
    <circle cx="185" cy="174" r="7" fill="#f97316" />
  </g>
</svg>
